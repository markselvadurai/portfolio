name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        registry: ghcr.io  # Target GHCR
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/markselvadurai/portfolio:latest

    - name: Push the Docker image
      run: docker push ghcr.io/markselvadurai/portfolio:latest
      
  deploy:
      runs-on: ubuntu-latest
      needs: build  # This ensures 'deploy' only runs after 'build' job succeeds

      steps:
        - name: SSH into VPS and deploy Docker image
          uses: appleboy/ssh-action@v0.1.5
          with:
            host: ${{ secrets.VPS_HOST }}  # Your VPS IP or domain
            username: root  # VPS username (e.g., root)
            key: ${{ secrets.VPS_PASSWORD }}  # Private SSH key
            port: 3000
            script: |
              # Log in to GHCR on the VPS
              echo ${{ secrets.DOCKER_PASSWORD }} | docker login ghcr.io -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
              # Pull the latest image
              docker pull ghcr.io/markselvadurai/portfolio:latest
              # Stop and remove the existing container if it's running
              docker stop portfolio || true
              docker rm portfolio || true
              # Run the new container
              docker run -d -p 3000:3000 --name portfolio ghcr.io/markselvadurai/portfolio:latest
